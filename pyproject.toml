# 独立的 lint 配置：backend 可以单独开、单独检查，不依赖仓库根的 pyproject。
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ['.pytest-tmp', 'relay_lab/vendor']

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I']
ignore = ['E501']

[tool.ruff.lint.isort]
known-first-party = ['relay_lab', 'evalscope']

[tool.ruff.format]
quote-style = 'single'
line-ending = 'lf'
indent-style = 'space'
